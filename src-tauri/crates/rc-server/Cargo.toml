[package]
name = "rc-server"
description = "Roughcut core module `server`: the media server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rc-types = { workspace = true }
# The server runs on its own small multi-threaded runtime (net, fs, sync, time).
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "fs", "io-util", "sync", "time", "macros"] }
# The per-launch token comes from the operating system's random source.
getrandom = "0.3.4"

[lints]
workspace = true
