[package]
name = "rc-speech"
description = "Roughcut core module `speech`: transcriber client and transcript building"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rc-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Model download (spec 2.4.9: the speech model is downloaded once on first run).
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }
sha2 = "0.10.9"
tar = "0.4.46"
bzip2 = "0.6.1"
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2"] }
# zip's deflate needs a backend; the pure-Rust one.
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }

[target.'cfg(windows)'.dependencies]
# A job object so a transcriber/claude child dies with the app, even after a crash.
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[[bin]]
# Stand-in transcriber that speaks the transcriber protocol; used by this crate's tests.
name = "rc-speech-standin"
path = "src/bin/standin.rs"
test = false
doc = false

[lints]
workspace = true
